name: verification-gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked dependencies
        run: |
          python -m venv agent/venv
          agent/venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Run backend contract suite
        run: >-
          agent/venv/bin/python -m pytest -q -m "not integration"
          --ignore=agent/tests/test_local_app.py agent/tests agent/pipeline/tests
      - name: Lint Python source
        run: agent/venv/bin/python -m ruff check agent setup.py
      - name: Build and smoke-test the installed Python wheel
        run: |
          agent/venv/bin/python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist-test
          agent/venv/bin/python -m pip install --no-deps --force-reinstall dist-test/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/agent/venv/bin/python" -c "import agent; import agent.cli; import agent.api.main"
      - name: Audit resolved Python dependency graph
        run: agent/venv/bin/python -m pip_audit --strict -r requirements.lock
      - name: Check launcher syntax
        run: >-
          bash -n scripts/xylon scripts/eda-runtime scripts/xylon-openroad
          runtime/openroad/bin/openroad

  openroad-foundation:
    name: OpenROAD foundation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent/openroad/package-lock.json
      - name: Install locked adapter and pinned OpenROAD runtime
        run: scripts/xylon-openroad install
      - name: Run OpenROAD adapter contracts
        working-directory: agent/openroad
        run: npm test
      - name: Audit OpenROAD adapter dependencies
        working-directory: agent/openroad
        run: npm audit
      - name: Exercise real OpenROAD MCP query, blocked change, exact prepared execution, and cleanup
        run: scripts/xylon-openroad smoke
      - name: Reject leaked OpenROAD containers
        if: always()
        run: |
          if docker ps -a --filter label=io.xylon.owner=openroad-mcp --format '{{.ID}}' | grep -q .; then
            docker ps -a --filter label=io.xylon.owner=openroad-mcp
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend contract tests
        working-directory: web
        run: npm run test:contracts
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Type-check
        working-directory: web
        run: npm run type-check
      - name: Audit dependencies
        working-directory: web
        run: npm audit
      - name: Build production application
        working-directory: web
        run: npm run build
      - name: Retain production Web build for launcher tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-production-build
          path: |
            web/.next/BUILD_ID
            web/.next/standalone
            web/.next/static
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  local-application:
    name: Local application (Linux)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install hash-locked dependencies
        run: |
          python -m venv agent/venv
          agent/venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Restore production Web build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-production-build
          path: web/.next
      - name: Run Linux launcher ownership and recovery tests
        run: agent/venv/bin/python -m pytest -q agent/tests/test_local_app.py

  runtime-integration:
    name: Runtime integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install hash-locked runtime test dependencies
        run: |
          python -m venv agent/venv
          agent/venv/bin/python -m pip install --require-hashes -r requirements.lock
      - name: Start pinned EDA runtime
        run: scripts/eda-runtime up
      - name: Verify runtime identity
        run: scripts/eda-runtime verify
      - name: Run real passing and failure integration tests
        run: agent/venv/bin/python -m pytest -q -m integration agent/pipeline/tests/test_pipeline.py
      - name: Retain runtime SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: xylon-eda:verilator-5.050-yosys-0.65
          artifact-name: xylon-eda-runtime.spdx.json
          output-file: xylon-eda-runtime.spdx.json
          format: spdx-json
      - name: Stop pinned EDA runtime
        if: always()
        run: scripts/eda-runtime down

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed content
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
